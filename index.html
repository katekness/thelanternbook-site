<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C100F">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
  <title>The Lantern Book: Cozy Sticker Worlds</title>
  <meta name="description" content="Open a storybook and make it yours. Peel, place, and arrange stickers in cozy little worlds. No ads, no timers, no rush. Coming soon to iPad.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thelanternbook.app/">
  <meta property="og:title" content="The Lantern Book: Cozy Sticker Worlds">
  <meta property="og:description" content="Cozy sticker worlds to decorate at your own pace. Coming soon to iPad.">
  <meta property="og:image" content="https://thelanternbook.app/assets/share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" as="image" href="/assets/logo-lantern.webp">
</head>
<body>
  <main class="landing">
    <div class="logo">
      <img class="glow" alt="" src="/assets/glow.webp">
      <div class="lantern">
        <img alt="" src="/assets/logo-lantern.webp">
        <img class="flame" alt="" src="/assets/flame-light.webp">
      </div>
      <img class="title" alt="The Lantern Book" src="/assets/logo-title.webp">
    </div>
    <p class="tagline">Open a world. Make it yours.</p>
    <p class="soon">Coming soon to iPad</p>
  </main>
  <footer>
    <a href="/">Home</a><a href="/privacy/">Privacy</a><a href="/support/">Support</a>
    <span class="copy">The Lantern Book is made by Skye Press &middot; &copy; 2026 Skye Press</span>
  </footer>
  <script>
    // A candle never flickers in a pattern: a few out-of-step waves plus a rare dip.
    (function () {
      var glow = document.querySelector('.glow'), flame = document.querySelector('.flame');
      var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var start = performance.now();
      function frame(now) {
        var t = (now - start) / 1000;
        var lit = Math.min(1, Math.max(0, (t - 0.25) / 1.1));
        lit = still ? 1 : 1 - Math.pow(1 - lit, 3);
        var f = still ? 0.9 : 0.88 + 0.07 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 12.9 + 1.3)
          + 0.035 * Math.sin(t * 23.1 + 2.1) + 0.02 * Math.sin(t * 41.7 + 0.4)
          + (Math.sin(t * 1.7) > 0.96 ? -0.12 : 0);
        flame.style.opacity = lit * Math.max(0, Math.min(1, (f - 0.62) * 2.4));
        glow.style.opacity = lit * (0.55 + (f - 0.88) * 2.2);
        glow.style.transform = 'translate(-50%, -50%) scale(' + (1 + (f - 0.88) * 0.18) + ')';
        if (!still) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
